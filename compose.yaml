# docker compose up -d --build
# Run only one instance (SQLite). Back up ./data (see .env.production.example).
services:
  mymimo:
    build: .
    image: mymimo:latest
    container_name: mymimo
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"  # host port from PORT in .env; put your HTTPS proxy in front of it
    environment:
      PORT: 3000              # inside the container it's always 3000 (overrides PORT from .env)
    env_file:
      - path: .env            # copy .env.production.example to .env and fill it in
        required: false
    volumes:
      - ./data:/data          # the SQLite database lives here, next to this file
